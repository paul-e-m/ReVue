<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ReVue-Remote</title>
        <link rel="stylesheet" href="styles.css?v=20261006-blank-role-option" />
</head>
<body>
    <div id="pageFrame" class="pageFrame">
    <main class="shell">
        <form id="controls" class="playerControls" autocomplete="off">
                <fieldset class="sessionControl controlGroup">
                    <legend class="visuallyHidden" data-i18n="rinkId">Rink ID</legend>
                    <span class="controlLabel" aria-hidden="true" data-i18n="rinkId">Rink ID</span>
                    <input id="sessionCode" name="sessionCode" type="text" maxlength="6" pattern="[A-Za-z0-9]{6}" spellcheck="false" aria-label="Six-character Rink ID" data-i18n-aria="rinkIdInput" />
                </fieldset>

                <fieldset class="volumeControl controlGroup">
                    <legend class="visuallyHidden" data-i18n="volume">Volume</legend>
                    <span class="controlLabel" aria-hidden="true" data-i18n="volume">Volume</span>
                    <div class="volumeInputRow">
                        <label class="volumeSliderControl" title="Volume" data-i18n-title="volume">
                            <input id="volume" class="volumeSlider" name="volume" type="range" min="0" max="100" value="100" step="1" aria-label="Video volume" data-i18n-aria="videoVolume" />
                        </label>
                        <label class="muteControl">
                            <input id="mute" type="checkbox" />
                            <span data-i18n="mute">Mute</span>
                        </label>
                    </div>
                </fieldset>

                <div class="roleReviewGroup">
                    <fieldset class="panelControl controlGroup">
                        <legend class="visuallyHidden" data-i18n="role">Role</legend>
                        <span class="controlLabel" aria-hidden="true" data-i18n="role">Role</span>
                        <input id="panelType" name="panelType" type="hidden" value="" />
                        <button id="panelTypeButton" class="panelTypeButton" type="button" aria-haspopup="listbox" aria-expanded="false">
                            <span id="panelTypeLabel">Select a role</span>
                            <span class="panelTypeSizer" aria-hidden="true" data-i18n="technicalController">Technical Controller</span>
                            <span class="panelChevron" aria-hidden="true">⌄</span>
                        </button>
                        <div id="panelTypeMenu" class="panelTypeMenu hidden" role="listbox" aria-label="Viewer panel type" data-i18n-aria="viewerRole">
                            <button type="button" role="option" data-panel-type="announcer" data-i18n="announcer">Announcer</button>
                            <button type="button" role="option" data-panel-type="data-input-operator" data-i18n="dataInputOperator">Data Input Operator</button>
                            <button type="button" role="option" data-panel-type="data-specialist" data-i18n="dataSpecialist">Event Technician</button>
                            <button type="button" role="option" data-panel-type="judging" data-i18n="judge">Judge</button>
                            <button type="button" role="option" data-panel-type="referee" data-i18n="referee">Referee</button>
                            <button type="button" role="option" data-panel-type="technical-controller" data-i18n="technicalController">Technical Controller</button>
                            <button type="button" role="option" data-panel-type="technical-specialist-1" data-i18n="technicalSpecialist1">Technical Specialist 1</button>
                            <button type="button" role="option" data-panel-type="technical-specialist-2" data-i18n="technicalSpecialist2">Technical Specialist 2</button>
                            <button type="button" role="option" data-panel-type="video-replay-operator" data-i18n="videoReplayOperator">Video Replay Operator</button>
                            <button type="button" role="option" data-panel-type="" aria-label="No role" data-i18n-aria="noRole"></button>
                        </div>
                    </fieldset>
                    <div id="reviewIndicator" class="reviewIndicator hidden" role="status" aria-live="polite">
                        <span class="reviewIndicatorDot" aria-hidden="true"></span>
                        <span id="reviewIndicatorText"></span>
                    </div>
                </div>

                <section id="communicationPanel" class="communicationPanel" aria-label="Panel status" data-i18n-aria="panelStatus">
                    <button type="button" class="communicationIndicator" data-communication-indicator="judges-ready" disabled><span class="communicationDot" aria-hidden="true"></span><span data-i18n="judgesReady">Judges</span></button>
                    <button type="button" class="communicationIndicator" data-communication-indicator="tech-panel-ready" disabled><span class="communicationDot" aria-hidden="true"></span><span data-i18n="techPanelReady">Tech</span></button>
                    <button type="button" class="communicationIndicator" data-communication-indicator="competitor-scored" disabled><span class="communicationDot" aria-hidden="true"></span><span data-i18n="competitorScored">Scored</span></button>
                    <span id="communicationFeedback" class="communicationFeedback" role="status" aria-live="polite"></span>
                </section>

                <div class="viewerUtilities">
                    <button id="refreshButton" class="refreshButton" type="button" aria-label="Refresh" data-i18n-aria="refresh">
                        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                            <path d="M20 11a8 8 0 1 0-2.2 6.2M20 4v7h-7" />
                        </svg>
                        <span data-i18n="refresh">Refresh</span>
                    </button>
                    <div class="languageControl">
                        <span class="languageLabel" data-i18n="language">Language</span>
                        <input id="language" name="language" type="hidden" value="en" />
                        <button id="languageButton" class="languageButton" type="button" aria-haspopup="listbox" aria-expanded="false" aria-label="Language" data-i18n-aria="language">
                            <span id="languageValueLabel">English</span>
                            <span class="panelChevron" aria-hidden="true">⌄</span>
                        </button>
                        <div id="languageMenu" class="languageMenu hidden" role="listbox" aria-label="Language" data-i18n-aria="language">
                            <button type="button" role="option" data-language="en">English</button>
                            <button type="button" role="option" data-language="fr">Français</button>
                        </div>
                    </div>
                </div>
        </form>

        <section class="viewer" aria-label="Passive remote replay player" data-i18n-aria="remotePlayer">
            <video id="video" playsinline preload="auto" disablepictureinpicture></video>
            <canvas id="liveTransitionFrame" class="liveTransitionFrame" aria-hidden="true"></canvas>
            <div id="playbackStatus" class="playbackStatus" data-i18n="waitingForRinkId">Waiting for a Rink ID and role.</div>
            <div id="connectedClientBadges" class="connectedClientBadges hidden" aria-live="polite"></div>
            <div id="emptyState" class="emptyState enterRinkId">
                <div class="testPattern">
                    <span id="testPatternLabel" class="testPatternLabel" data-i18n="noSignal">NO SIGNAL</span>
                </div>
                <span id="emptyStateMessage" class="emptyStateMessage" data-i18n="enterRinkId">Welcome to ReVue-Remote
Enter a Rink ID and select a role</span>
                <div id="audioTestFeedback" class="audioTestFeedback">
                    <svg class="audioTestWave" viewBox="0 0 72 24" aria-hidden="true">
                        <path d="M0 12 C3 2 9 2 12 12 S21 22 24 12 S33 2 36 12 S45 22 48 12 S57 2 60 12 S69 22 72 12 S81 2 84 12 S93 22 96 12" />
                    </svg>
                    <span id="audioTestLevel" class="audioTestLevel" role="status" aria-live="polite">
                        <span id="audioTestLevelText"></span>
                    </span>
                </div>
                <button id="audioTestButton" class="audioTestButton" type="button" aria-pressed="false">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M3 9v6h4l5 4V5L7 9H3Z" />
                        <path d="M15 9a5 5 0 0 1 0 6M18 6a9 9 0 0 1 0 12" />
                    </svg>
                    <span id="audioTestLabel" data-i18n="playTestTone">Sound check</span>
                </button>
            </div>
            <div id="judgingTransport" class="judgingTransport hidden">
                <button id="refereeStopwatch" class="refereeStopwatch hidden" type="button" title="Set stopwatch zero" aria-label="Set stopwatch zero" aria-pressed="false" data-i18n-title="setStopwatchZero" data-i18n-aria="setStopwatchZero">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M9 2h6M12 2v3M17.5 6.5l1.7-1.7M12 7a7 7 0 1 1-7 7 7 7 0 0 1 7-7Z" />
                        <path d="M12 10v4l2.6 1.6" />
                    </svg>
                </button>
                <button id="judgingPlayPause" class="judgingPlayPause" type="button" data-i18n="play" data-i18n-aria="playVideo">Play</button>
            </div>
            <div id="communicationAlertStack" class="communicationAlerts">
                <div id="communicationAlertJudges" class="communicationAlert judges-ready hidden" role="alert" aria-live="assertive" aria-atomic="true"><span class="communicationAlertCheck" aria-hidden="true"><span class="communicationAlertReadyIcon">✓</span><span class="communicationAlertNotReadyIcon hidden">×</span></span><span class="communicationAlertCopy"><strong class="communicationAlertReadyMessage" data-i18n="judgesReadyAlert">Judges Ready</strong><strong class="communicationAlertNotReadyMessage hidden" data-i18n="judgesNotReadyAlert">Judges Not Ready</strong></span></div>
                <div id="communicationAlertTech" class="communicationAlert tech-panel-ready hidden" role="alert" aria-live="assertive" aria-atomic="true"><span class="communicationAlertCheck" aria-hidden="true"><span class="communicationAlertReadyIcon">✓</span><span class="communicationAlertNotReadyIcon hidden">×</span></span><span class="communicationAlertCopy"><strong class="communicationAlertReadyMessage" data-i18n="techPanelReadyAlert">Tech Panel Ready</strong><strong class="communicationAlertNotReadyMessage hidden" data-i18n="techPanelNotReadyAlert">Tech Panel Not Ready</strong></span></div>
                <div id="communicationAlertScored" class="communicationAlert competitor-scored hidden" role="alert" aria-live="assertive" aria-atomic="true"><span class="communicationAlertCheck" aria-hidden="true">✓</span><span class="communicationAlertCopy"><strong data-i18n="competitorScoredAlert">Competitor Scored</strong></span></div>
            </div>
        </section>

        <section id="timelineSection" class="timelineSection" aria-label="Video timeline" data-i18n-aria="videoTimeline" hidden>
            <div id="timelineControlRow" class="timelineControlRow">
                <div id="refereeTimer" class="refereeTimer hidden" aria-live="off"></div>
                <div id="replayProgramTimeIndicator" class="replayProgramTimeIndicator hidden" aria-live="off">00:00:00</div>
                <canvas id="timelineCanvas" class="timelineCanvas" role="slider" aria-label="Video playback position" data-i18n-aria="videoPlaybackPosition" aria-valuemin="0" aria-valuemax="0" aria-valuenow="0" aria-disabled="true"></canvas>
            </div>
            <div class="timelineMetaRow">
                <div id="networkIndicator" class="networkIndicator checking" role="status" aria-live="polite" aria-label="Checking server connectivity" data-i18n-aria="checkingServer">
                    <svg class="wifiIcon" viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M2.5 8.7a14.5 14.5 0 0 1 19 0" />
                        <path d="M5.8 12.1a9.6 9.6 0 0 1 12.4 0" />
                        <path d="M9.1 15.5a4.7 4.7 0 0 1 5.8 0" />
                        <circle cx="12" cy="19" r="1.2" />
                    </svg>
                    <span id="networkLatency" data-i18n="checking">CHECKING…</span>
                    <span class="networkTransferSeparator" aria-hidden="true">·</span>
                    <span id="networkTransfer" aria-live="off" aria-label="Data transfer unavailable">— Mbps</span>
                    <span class="networkTransferSeparator" aria-hidden="true">·</span>
                    <span id="networkCache" aria-live="off" aria-label="Local video cache unavailable">— MB</span>
                </div>
                <span id="vroConnectionStatus" class="vroConnectionStatus disconnected" role="status" aria-live="polite">VRO Offline</span>
                <div id="videoFileName" class="videoFileName"></div>
            </div>
        </section>
    </main>
    </div>

    <script src="hls.min.js?v=1.6.13"></script>
    <script src="app.js?v=20261006-blank-role-option"></script>
</body>
</html>
